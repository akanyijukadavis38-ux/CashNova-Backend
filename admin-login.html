<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CashNova Admin Login</title>

<style>

/* =====================================
   CASHNOVA PREMIUM ADMIN LOGIN
===================================== */


*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:"Segoe UI",Arial,sans-serif;

    background:linear-gradient(
        135deg,
        #001f54,
        #0066ff
    );

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

}



/* LOGIN CARD */

.login-box{

    width:90%;

    max-width:360px;

    background:white;

    padding:28px 22px;

    border-radius:24px;

    text-align:center;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

}



/* LOGO */

.logo{

    width:75px;

    height:75px;

    object-fit:contain;

    margin-bottom:10px;

}



/* TITLE */

h2{

    margin:5px 0;

    color:#0066ff;

    font-size:22px;

    font-weight:800;

}



p{

    color:#667085;

    font-size:13px;

    margin-bottom:20px;

}



/* INPUT */

input{

    width:100%;

    padding:12px;

    margin-bottom:14px;

    border-radius:12px;

    border:1px solid #dce3ef;

    outline:none;

    font-size:14px;

}



input:focus{

    border-color:#0066ff;

}



/* BUTTON */

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#0066ff;

    color:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    background:#001f54;

}



/* MOBILE SMALL */

@media(max-width:360px){

.login-box{

    padding:22px 18px;

}


.logo{

    width:65px;

    height:65px;

}


}

</style>


</head>


<body>


<div class="login-box">


<img src="logo.png" class="logo">


<h2>
CashNova Admin
</h2>


<p>
Enter Admin Password
</p>


<input 
type="password"
id="adminPassword"
placeholder="Admin password"
>


<button id="loginBtn">

Login

</button>


</div>

<script>

document.getElementById("loginBtn").onclick = async function () {

    const password =
        document.getElementById("adminPassword").value.trim();

    if (!password) {

        alert("Please enter the admin password");

        return;
    }

    try {

        const response = await fetch(
            "https://cashnova-backend-89lg.onrender.com/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "Admin login failed"
            );

            return;
        }

        if (!data.token) {

            alert(
                "Admin login succeeded, but no security token was received."
            );

            return;
        }

        localStorage.setItem(
            "cashnovaAdminToken",
            data.token
        );

        localStorage.setItem(
            "cashnovaAdminSession",
            "true"
        );

        window.location.href = "admin.html";

    } catch (error) {

        console.log(
            "Admin login error:",
            error
        );

        alert(
            "Unable to connect to CashNova server."
        );

    }

};

</script>



</body>

</html>
