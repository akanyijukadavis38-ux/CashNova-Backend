<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CashNova Admin Management</title>

<link rel="stylesheet" href="admin.css">

<link rel="stylesheet" href="admin-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="admin-page">



<!-- HEADER -->

<header class="admin-header">


<div class="admin-brand">

<h1 id="managementTitle">
Admin Management
</h1>


<p>
CashNova Control
</p>


</div>



<div class="admin-profile">

<i class="fa-solid fa-user-shield"></i>

</div>



</header>







<!-- CONTENT AREA -->


<section class="admin-section">


<div id="managementContainer">


<div class="empty-state">

Loading...

</div>


</div>




<!-- ===============================
     ALL USERS SECTION
================================ -->


<div id="usersSection" style="display:none;">


<h2>
All Users
</h2>



<div id="usersContainer">


</div>



</div>






<!-- ===============================
     ACTIVE USERS SECTION
================================ -->


<div id="activeUsersSection" style="display:none;">


<h2>
Active Users
</h2>



<div id="activeUsersContainer">


</div>



</div>







<!-- ===============================
     FINANCIAL RECORDS SECTION
================================ -->


<div id="financialSection" style="display:none;">


<h2>
Financial Records
</h2>



<div id="financialContainer">


</div>



</div>







<!-- ===============================
     SUPPORT SECTION
================================ -->


<div id="supportSection" style="display:none;">


<h2>
Support Requests
</h2>



<div id="supportContainer">


</div>



</div>









<!-- ===============================
     ANNOUNCEMENTS SECTION
================================ -->

<div id="announcementSection" style="display:none;">

<h2>
Announcements
</h2>


<div class="announcement-create">

<textarea 
id="announcementText"
placeholder="Write announcement here..."
></textarea>


<button id="addAnnouncementBtn">
Post Announcement
</button>

</div>



<div id="announcementContainer">

</div>


</div>







</section>






</div>
  





<script src="admin-management.js"></script>


</body>

</html>
