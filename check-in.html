<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="check-in.css">

</head>


<body>


<div class="checkin-page">


<header class="checkin-header">

<button onclick="history.back()">
←
</button>

<div>

<h1>
CashNova Check-in
</h1>

<p>
Earn daily rewards
</p>

</div>

</header>




<section class="checkin-card">


<h2>
Daily Check-in Reward
</h2>


<div class="reward-box">

<h1>
UGX 100
</h1>

Available every 24 hours
</p>

</div>



<button id="checkInButton">

Check In Now

</button>



<p id="checkMessage">

</p>


</section>





<section class="bonus-card">


<h3>
Total Check-in Bonus
</h3>

UGX 0

</h2>


</section>

Check-in Rules
</h3>

✓ Check in once every 24 hours
</p>

<p>

</p>
